<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CERDAS - Kabupaten Semarang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-container { height: 400px; }
    </style>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">

    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        <!-- Header -->
        <div class="bg-blue-800 p-4 text-white text-center font-bold">CERDAS - Kab. Semarang</div>
        
        <!-- Chat Area -->
        <div id="chat-box" class="chat-container p-4 overflow-y-auto bg-gray-50 space-y-3"></div>

        <!-- Input Area -->
        <div class="p-4 border-t flex">
            <input id="user-input" class="flex-1 border rounded-l-lg p-2 focus:outline-none" placeholder="Tanya sesuatu...">
            <button onclick="sendMessage()" class="bg-blue-800 text-white px-4 rounded-r-lg hover:bg-blue-700">Kirim</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            if(!input.value) return;

            chatBox.innerHTML += '<div class="text-right"><p class="bg-blue-100 p-2 rounded-lg inline-block">' + input.value + '</p></div>';
            
            const query = input.value;
            input.value = '';

            const response = await fetch('http://127.0.0.1:8000/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: query})
            });
            const data = await response.json();
            chatBox.innerHTML += '<div class="text-left"><p class="bg-gray-200 p-2 rounded-lg inline-block">' + data.response + '</p></div>';
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
