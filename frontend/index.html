<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>CERDAS - Voice Enabled</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex justify-center items-center h-screen">
    <div class="w-full max-w-md bg-white rounded-2xl shadow-xl overflow-hidden">
        <div class="bg-blue-800 p-4 text-white text-center font-bold">CERDAS - Kab. Semarang</div>
        <div id="chat-box" class="h-80 p-4 overflow-y-auto bg-gray-50 space-y-3"></div>
        <div class="p-4 border-t flex gap-2">
            <input id="user-input" class="flex-1 border rounded-lg p-2" placeholder="Tanya sesuatu...">
            <button onclick="startRecording()" class="bg-red-500 text-white px-3 rounded-lg">🎙️</button>
            <button onclick="sendMessage()" class="bg-blue-800 text-white px-4 rounded-lg">Kirim</button>
        </div>
    </div>
    <script>
        let mediaRecorder;
        let audioChunks = [];

        async function startRecording() {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(audioChunks, { type: 'audio/mp3' });
                const formData = new FormData();
                formData.append('file', audioBlob, 'audio.mp3');
                const res = await fetch('http://127.0.0.1:8000/transcribe', { method: 'POST', body: formData });
                const data = await res.json();
                document.getElementById('user-input').value = data.text;
                audioChunks = [];
            };
            mediaRecorder.start();
            setTimeout(() => mediaRecorder.stop(), 5000); // Rekam 5 detik
        }

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += '<p class="text-right bg-blue-100 p-2 rounded-lg">' + input.value + '</p>';
            
            const response = await fetch('http://127.0.0.1:8000/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({query: input.value})
            });
            const data = await response.json();
            chatBox.innerHTML += '<p class="text-left bg-gray-200 p-2 rounded-lg">' + data.response + '</p>';
            input.value = '';
        }
    </script>
</body>
</html>
